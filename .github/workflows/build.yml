name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./lavalink
          file: ./lavalink/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/discord-music-railway-lavalink:4.2.2
            ghcr.io/${{ github.repository_owner }}/discord-music-railway-lavalink:latest
      - uses: docker/build-push-action@v6
        with:
          context: ./bot
          file: ./bot/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/discord-music-railway-bot:4.6.7
            ghcr.io/${{ github.repository_owner }}/discord-music-railway-bot:latest
